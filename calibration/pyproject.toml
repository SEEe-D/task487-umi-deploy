[project]
name = "dual-arm-urdf-manual-calibration"
version = "1.0.0"
description = "Interactive five-frame dual-arm URDF extrinsic calibration and fisheye projection validation"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fast-simplification",
  "numba>=0.60",
  "numpy==2.2.6",
  "opencv-python==4.10.0.84",
  "pandas==2.2.3",
  "pyarrow==24.0.0",
  "pyyaml==6.0.2",
  "trimesh==4.7.1",
]

